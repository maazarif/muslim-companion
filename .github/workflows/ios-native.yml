# Builds the native iPhone app (Swift + SwiftUI) in apps/ios on a Mac.
# - Unit tests on the iOS Simulator: every prayer time in the eight published timetables, the qibla,
#   Hijri dates, next/now, bundled fonts.
# - Builds for real iPhones (unsigned) to check it compiles for devices.
# Then it opens a test build on the Simulator and saves screenshots to the native-builds-ios-native branch.
# Installing on a real iPhone needs an Apple Developer account (TestFlight) or Xcode on a Mac.
name: Native iPhone app
on:
  push:
    branches: [main]
    paths: ["apps/ios/**", "tests/fixtures/**", ".github/workflows/ios-native.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: ios-native
  cancel-in-progress: true
jobs:
  build:
    runs-on: macos-15
    env:
      VERSION_CODE: ${{ github.run_number }}
    defaults:
      run: { working-directory: apps/ios }
    steps:
      - uses: actions/checkout@v4
      - name: Generate the Xcode project
        run: |
          command -v xcodegen || brew install xcodegen
          xcodegen generate
          xcodebuild -version
      - name: Pick an iPhone simulator
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print(next(x['udid'] for k in sorted(d, reverse=True) if 'iOS' in k for x in d[k] if x['name'].startswith('iPhone')))")
          echo "UDID=$UDID" >> "$GITHUB_ENV"; echo "Simulator $UDID"
      - name: Unit tests (prayer times, qibla, Hijri, fonts)
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild test -project Mushaf.xcodeproj -scheme Mushaf -destination "platform=iOS Simulator,id=$UDID" \
            -derivedDataPath build/test -resultBundlePath build/tests.xcresult CODE_SIGNING_ALLOWED=NO \
            | tee build/test.log | grep -E "Test Case .*(passed|failed)|error:|XCTAssert|Executed" ; exit ${PIPESTATUS[0]}
      - name: Build for iPhone (device, unsigned)
        run: |
          set -o pipefail
          xcodebuild -project Mushaf.xcodeproj -scheme Mushaf -sdk iphoneos -configuration Release -derivedDataPath build/device CODE_SIGNING_ALLOWED=NO build | tail -3
      - name: Run it on the simulator and take screenshots
        run: |
          set -o pipefail
          xcodebuild -project Mushaf.xcodeproj -scheme Mushaf -sdk iphonesimulator -configuration Debug -derivedDataPath build/sim CODE_SIGNING_ALLOWED=NO build | tail -2
          APP=build/sim/Build/Products/Debug-iphonesimulator/Mushaf.app
          mkdir -p ../../out
          plutil -p "$APP/Info.plist" | grep -E "CFBundleIdentifier|CFBundleDisplayName|CFBundleVersion|UIAppFonts|NSLocation" | tee ../../out/info.txt
          xcrun simctl boot "$UDID" 2>/dev/null || true; xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$APP"
          xcrun simctl ui "$UDID" appearance light
          SIMCTL_CHILD_TZ=Europe/London xcrun simctl launch "$UDID" io.github.maazarif.mushaf.preview -seedLat 51.5074 -seedLng -0.1278 -seedLabel London
          sleep 8; xcrun simctl io "$UDID" screenshot ../../out/iphone-native-prayer.png
          xcrun simctl ui "$UDID" appearance dark; sleep 4; xcrun simctl io "$UDID" screenshot ../../out/iphone-native-prayer-dark.png
          xcrun simctl spawn "$UDID" log show --last 2m --style compact --predicate 'process == "Mushaf" AND messageType >= 16' > ../../out/app-log.txt 2>&1 || true
      - name: Collect test results
        if: always()
        run: mkdir -p ../../out && cp build/test.log ../../out/ 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mushaf-ios-native, path: out }
      - name: Save screenshots to the native-builds-ios-native branch
        if: always()
        working-directory: .
        run: |
          mkdir -p out && cd out && git init -q -b native-builds-ios-native && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q --allow-empty -m "Native iOS simulator run ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" native-builds-ios-native

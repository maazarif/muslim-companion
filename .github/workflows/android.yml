# Builds the Android app with Capacitor (the web app's files inside a native app, with prayer notifications).
# - companion-test.apk: signed with the test key in native/android; install it on any Android phone.
# Then it runs a test build on an Android emulator: checks Android scheduled the prayer alarms, that a
# notification appears, and saves screenshots to the native-builds-android branch.
name: Android app
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: npm install --no-audit --no-fund
      - name: Create and update the Android project
        run: node tools/native.mjs android
      - name: Build the app
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease
      - name: Build a test copy that starts with a location and notifications on
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk out/companion-test.apk
          node tools/native.mjs android --seed tests/fixtures/native-seed.json
          (cd android && ./gradlew --no-daemon assembleDebug)
          cp android/app/build/outputs/apk/debug/app-debug.apk out/companion-e2e.apk
      - name: Check the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs out/companion-test.apk | head -3
          "$BT/aapt2" dump badging out/companion-test.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-label:|uses-permission" | tee out/badging.txt
          "$BT/aapt2" dump resources out/companion-test.apk | grep -E "raw/chime|drawable/ic_stat_prayer" | tee -a out/badging.txt
          grep -q "raw/chime" out/badging.txt && grep -q "SCHEDULE_EXACT_ALARM" out/badging.txt && grep -q "ACCESS_FINE_LOCATION" out/badging.txt
      - uses: actions/upload-artifact@v4
        with: { name: companion-android, path: out }
      - name: Publish on the Releases page (open it on your phone to download and install)
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete android-latest -y --cleanup-tag 2>/dev/null || true
          gh release create android-latest out/companion-test.apk --prerelease --target "$GITHUB_SHA" \
            --title "Android app — latest build (${GITHUB_SHA::7})" \
            --notes "**companion-test.apk**: open this page on your Android phone, download the file and open it to install. Allow installing from your browser when asked. New builds install over the old one and keep your settings."

  try-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: companion-android, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Run the test build on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: bash native/android/emulator-test.sh out
      - name: Save screenshots and logs to the native-builds-android branch
        if: always()
        run: |
          mkdir shots && cp out/*.png out/*.txt shots/ 2>/dev/null; cd shots
          git init -q -b native-builds-android && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Android emulator run ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" native-builds-android

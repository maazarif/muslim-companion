# On every push to main: run the tests, then publish the app files to the gh-pages branch,
# which GitHub Pages serves at https://<username>.github.io/<repository>/
name: Test and publish
on:
  push:
    branches: [main]
    paths-ignore: ["native/**", ".github/workflows/android.yml", ".github/workflows/ios.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Check the live gold and silver price feed (warning only)
        continue-on-error: true
        run: |
          curl -fsS https://cdn.jsdelivr.net/npm/@fawazahmed0/currency-api@latest/v1/currencies/xau.min.json -o xau.json
          node -e 'const d=require("./xau.json"); const age=(Date.now()-new Date(d.date))/864e5; console.log("feed", d.date, "gold $"+d.xau.usd.toFixed(2)+"/oz", "silver $"+(d.xau.usd/d.xau.xag).toFixed(2)+"/oz"); if(!(d.xau.usd>0&&d.xau.xag>0)) throw new Error("no gold or silver price"); if(age>4) throw new Error("feed is "+Math.round(age)+" days old")'

  publish:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Collect site files
        run: node tools/build-www.mjs && mv www _site
      - name: Publish to gh-pages
        run: |
          cd _site
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Publish ${GITHUB_SHA::7}"
          git push -f "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" gh-pages

# Builds the native Android app (Kotlin + Jetpack Compose) in apps/android.
# - Unit tests: every prayer time in the eight published timetables, the qibla, Hijri dates, next/now.
# - mushaf-preview.apk: signed with the test key; installs alongside the current apps (its own app ID).
# Then it opens the test build on an emulator, checks the Prayer screen and saves screenshots
# to the native-builds-android-native branch.
name: Native Android app
on:
  push:
    branches: [main]
    paths: ["apps/android/**", "tests/fixtures/**", "native/android/test.keystore", ".github/workflows/android-native.yml"]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: android-native
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    env:
      VERSION_CODE: ${{ github.run_number }}
    defaults:
      run: { working-directory: apps/android }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - uses: gradle/actions/setup-gradle@v4
      - name: Unit tests (prayer times, qibla, Hijri)
        run: ./gradlew --no-daemon testReleaseUnitTest
      - name: Build the app
        run: ./gradlew --no-daemon assembleRelease assembleDebug
      - name: Collect
        if: always()
        run: |
          mkdir -p ../../out
          cp app/build/outputs/apk/release/app-release.apk ../../out/mushaf-preview.apk 2>/dev/null || true
          cp app/build/outputs/apk/debug/app-debug.apk ../../out/mushaf-preview-debug.apk 2>/dev/null || true
          cp -r app/build/reports/tests ../../out/test-report 2>/dev/null || true
          cp app/build/test-results/testReleaseUnitTest/*.xml ../../out/ 2>/dev/null || true
      - name: Check the APK
        run: |
          BT="$ANDROID_HOME/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)"
          "$BT/apksigner" verify --print-certs ../../out/mushaf-preview.apk | head -3
          "$BT/aapt2" dump badging ../../out/mushaf-preview.apk | grep -E "^package|sdkVersion|targetSdkVersion|application-label:|uses-permission"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: mushaf-android-native, path: out }
      - name: Publish on the Releases page
        env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          gh release delete android-native-latest -y --cleanup-tag 2>/dev/null || true
          gh release create android-native-latest ../../out/mushaf-preview.apk --prerelease --target "$GITHUB_SHA" \
            --title "Native Android preview — latest build (${GITHUB_SHA::7})" \
            --notes "**mushaf-preview.apk**: the new native app (early preview: Prayer screen only). It installs next to your current apps and doesn't replace them."

  try-on-emulator:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: mushaf-android-native, path: out }
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - name: Open the app on an emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          profile: pixel_6
          script: bash apps/android/emulator-test.sh out
      - name: Save screenshots to the native-builds-android-native branch
        if: always()
        run: |
          mkdir shots && cp out/*.png out/*.txt out/*.xml shots/ 2>/dev/null; cd shots
          git init -q -b native-builds-android-native && git config user.name "github-actions[bot]" && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A && git commit -q -m "Native Android emulator run ${GITHUB_SHA::7}"
          git push -qf "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${GITHUB_REPOSITORY}.git" native-builds-android-native
